<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Vruuum! — Bolinho de Chuva · SolverONE</title>
<link rel="icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#0b0a1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Corrida de carrinho para a família: desvie, pegue estrelas, pule rampas e passe por 4 mundos. 1 ou 2 jogadores. / Family kart race: dodge, grab stars, jump ramps across 4 worlds.">
<link rel="stylesheet" href="estilo.css">
<!--
  Vruuum! — quarta brincadeira da família Bolinho de Chuva (SolverONE · Feature Tester).
  Corrida de carrinho em 3D: desviar do trânsito, dos cones e da lama, pegar estrelas, turbo de
  arco-íris e rampas, passando por 4 mundos (praia, floresta, doces, neve, cidade neon).
  1 jogador ou 2 na mesma tela (dividida). Toque, teclado, controle de videogame, controle da TV
  ou o acelerômetro do celular. Sem login, sem banco, sem cookie: só arquivos estáticos (cache no aparelho
  pelo sw.js). Nenhum script inline: a CSP acima não permite. Mapa dos arquivos: LEIA-ME.md.
  Versão: APP_VERSION em app.js, VERSAO em sw.js e versoes.json.
-->
</head>
<body>

<section id="entrada" class="tela ativa" data-recurso="vruuum">
  <div class="estrada-fundo" aria-hidden="true"></div>
  <h1 class="logo">Vruuum!</h1>
  <p class="sub" data-t="corrida de carrinho da família|the family kart race"></p>
  <button id="btEntrar" class="grande" type="button" data-t="🔑 Toque para ligar o motor!|🔑 Tap to start your engine!"></button>
  <p class="dica" data-t="Aumente o volume 🔊|Turn the volume up 🔊"></p>
</section>

<section id="menu" class="tela" data-recurso="vruuum">
  <div class="faixa">
    <button id="btLingua" class="mini" type="button" aria-label="Idioma / Language">EN</button>
    <button id="btSom" class="mini" type="button" aria-label="Som / Sound">🔊</button>
    <button id="btAjuda" class="mini" type="button" aria-label="Como jogar / How to play" aria-expanded="false">❓</button>
  </div>
  <h1 class="logo pequeno">Vruuum!</h1>

  <div id="ajuda" class="ajuda" hidden>
    <p data-t="✈️ Avião, jato e helicóptero voam: a estrada fica lá embaixo e você segue o caminho de luzes no céu, desviando de pássaros, nuvens de tempestade e outros aviões. Os anéis dourados dão TURBO e as correntes de ar levam lá para cima, até as estrelas altas.|✈️ Plane, jet and helicopter fly: the road stays far below and you follow the path of lights in the sky, dodging birds, storm clouds and other planes. Golden rings give TURBO and updrafts lift you up to the high stars."></p>
    <p data-t="O carro acelera sozinho. Você vira para a esquerda e para a direita e aperta ⬆ PULAR para passar por cima dos cones, da lama e dos carrinhos. Pegue as ⭐ estrelas, passe pelo 🌈 arco-íris para ganhar TURBO e suba na rampa para um pulão até as estrelas do ar. Ninguém perde: bater só deixa o carro mais lento e derruba umas estrelas.|The car speeds up by itself. Steer left and right and press ⬆ JUMP to hop over cones, mud and cars. Grab the ⭐ stars, drive through the 🌈 rainbow for TURBO and hit the ramp for a big jump to the stars in the air. Nobody loses: crashing only slows you down and drops a few stars."></p>
    <p data-t="👆 Celular ou tablet (deitado ou em pé): segure o lado esquerdo ou direito da tela para virar; toque no botão ⬆ ou deslize o dedo para cima para pular. Com 2 jogadores, cada um no seu pedaço da tela.|👆 Phone or tablet (sideways or upright): hold the left or right side of the screen to steer; tap the ⬆ button or swipe up to jump. With 2 players, each one on their own half."></p>
    <p data-t="📱 Com 1 jogador, o celular também é volante: incline para um lado e o carro vira; dê um toquinho com o celular para cima e o carro pula. Celular retinho = carro reto.|📱 With 1 player, the phone is also a steering wheel: tilt it and the car turns; give the phone a little flick up and the car jumps. Phone level = car straight."></p>
    <p data-t="⌨️ Teclado: setas para virar e ⬆ (ou espaço) para pular; com 2 jogadores, jogador 1 usa A, D e W, jogador 2 as setas. H = buzina, para baixo = freio. 📺 Controle da TV: setas para virar, OK para pular. 🎮 Controle de videogame: A pula, X buzina.|⌨️ Keyboard: arrows to steer and ⬆ (or space) to jump; with 2 players, player 1 uses A, D and W, player 2 the arrows. H = horn, down = brake. 📺 TV remote: arrows to steer, OK to jump. 🎮 Game controller: A jumps, X honks."></p>
  </div>

  <div class="grupo">
    <p class="rotulo" data-t="Quantos vão correr?|How many racers?"></p>
    <div class="opcoes" role="group">
      <button class="opcao" type="button" data-jogadores="1" data-t="🚗 1 jogador|🚗 1 player"></button>
      <button class="opcao" type="button" data-jogadores="2" data-t="🚗🚙 2 jogadores|🚗🚙 2 players"></button>
    </div>
  </div>

  <div class="grupo">
    <p class="rotulo" data-t="Nível|Level"></p>
    <div class="opcoes" role="group">
      <button class="opcao crianca" type="button" data-nivel="crianca" data-t="🐢 Criança|🐢 Kids"></button>
      <button class="opcao normal" type="button" data-nivel="normal" data-t="🚗 Normal|🚗 Normal"></button>
      <button class="opcao turbo" type="button" data-nivel="turbo" data-t="🚀 Turbo|🚀 Turbo"></button>
    </div>
  </div>

  <div id="garagem" class="garagem">
    <div class="vitrine">
      <div id="abas" class="abas" role="tablist" hidden>
        <button class="aba" type="button" role="tab" data-aba="0"></button>
        <button class="aba" type="button" role="tab" data-aba="1"></button>
      </div>
      <canvas id="previa" class="previa" width="560" height="340" aria-hidden="true"></canvas>
      <p id="nomeVeic" class="nome-veic" aria-live="polite"></p>
      <div class="fichas">
        <span data-t="Velocidade|Speed"></span><span class="barra"><i id="barraVel"></i></span>
        <span data-t="Curvas|Handling"></span><span class="barra"><i id="barraCurva"></i></span>
      </div>
      <p id="dicaTecla" class="tecla" hidden></p>
    </div>
    <div class="opcoes-garagem">
      <p class="rotulo titulo-garagem" data-t="Escolha o veículo|Pick your ride"></p>
      <div id="veiculos" class="veiculos"></div>
      <p class="rotulo" data-t="Cor|Color"></p>
      <div id="cores" class="cores" role="group" aria-label="Cor / Color"></div>
      <p class="rotulo" data-t="Piloto|Driver"></p>
      <div id="bichos" class="bichos" role="group" aria-label="Piloto / Driver"></div>
    </div>
  </div>

  <div class="barra-correr">
    <button id="btCorrer" class="grande" type="button" data-t="🏁 Correr!|🏁 Race!"></button>
  </div>
  <p class="recorde-menu"><span data-t="Recorde de estrelas neste nível|Star record on this level"></span>: <b id="recordeMenu">0</b></p>
  <div id="guardar" class="guardar">
    <button id="btGuardar" class="medio" type="button" data-t="📲 Guardar no celular|📲 Save on the phone"></button>
    <p id="guardarAviso" class="dica" aria-live="polite" data-t="Para jogar sem internet, com ícone na tela. Sem login.|To play offline, with an icon on the home screen. No login."></p>
  </div>
  <p id="tocando" class="rodape" aria-live="polite"></p>
  <p class="rodape"><span id="ver"></span> · SolverONE · <a href="https://solverone.com.br/bolinho-de-chuva/" data-t="🍩 Mais brincadeiras|🍩 More games"></a></p>
</section>

<section id="jogo" class="tela">
  <canvas id="tela"></canvas>
  <button id="btPausa" class="mini pausa" type="button" aria-label="Pausar / Pause">⏸</button>
  <div id="pausa" class="pausa-painel" hidden>
    <h2 data-t="Pausa|Paused"></h2>
    <button id="btContinuar" class="grande" type="button" data-t="▶ Continuar|▶ Resume"></button>
    <button id="btRecomecar" class="medio" type="button" data-t="🔁 Começar de novo|🔁 Restart"></button>
    <button id="btSair" class="medio" type="button" data-t="🏠 Menu|🏠 Menu"></button>
  </div>
</section>

<section id="fim" class="tela">
  <h2 class="logo pequeno" data-t="🏁 Fim da corrida!|🏁 Race over!"></h2>
  <div id="resultado" class="resultado" aria-live="polite"></div>
  <p id="novoRecorde" class="recorde-novo" hidden data-t="🎉 Novo recorde de estrelas!|🎉 New star record!"></p>
  <p class="recorde-menu"><span data-t="Recorde|Record"></span>: <b id="recordeFim">0</b> ⭐</p>
  <button id="btDeNovo" class="grande" type="button" data-t="🔁 Correr de novo|🔁 Race again"></button>
  <button id="btMenu" class="medio" type="button" data-t="🏠 Menu|🏠 Menu"></button>
</section>

<section id="desligado" class="tela">
  <p data-t="Esta brincadeira está desligada no momento.|This game is turned off right now."></p>
</section>

<div id="aviso" class="sr" aria-live="polite"></div>
<div id="sondaBorda" aria-hidden="true"></div>

<script src="pista.js"></script>
<script src="motor.js"></script>
<script src="sprites.js"></script>
<script src="veiculos.js"></script>
<script src="desenho.js"></script>
<script src="rock.js"></script>
<script src="som.js"></script>
<script src="movimento.js"></script>
<script src="baixar.js"></script>
<script src="../recursos.js" data-app="feature-tester" data-fora-do-arquivo></script>
<script src="app.js"></script>
</body>
</html>
