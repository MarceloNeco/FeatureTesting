<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dança na Sala — FeatureTesting</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💃</text></svg>">
<link rel="manifest" href="danca-na-sala.webmanifest">
<link rel="apple-touch-icon" href="danca-na-sala-icone.png">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<!--
  Dança na Sala / Living Room Dance — experimento do FeatureTesting (SolverONE)

  A MESMA página serve a TV e o celular:
    TV      → abre no navegador da TV, aperta "Esta é a TV", mostra um código de 4 letras.
    Celular → abre a mesma página, digita nome e código, liga a câmera.
  O celular manda o vídeo da câmera para a TV direto pelo Wi-Fi (WebRTC, ponto a ponto: por isso
  não tem atraso) e mede quanto a pessoa se mexe (diferença entre quadros, sem IA). A TV toca a
  música do YouTube, mostra as câmeras e o placar. Os comandos (tocar, pausar, trocar música)
  saem do celular. Celular e TV se encontram pelo Supabase Realtime da plataforma (só mensagens
  pequenas; nenhum vídeo passa pelo servidor; chave publishable, pública por desenho).
-->
<style>
:root{--bg:#0f1115;--card:#1a1d24;--text:#e8eaed;--muted:#9aa0a6;--border:#2a2f3a;--accent:#4285f4;--ok:#34a853;--warn:#f9ab00;--danger:#ea4335}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 18px;background:var(--accent);color:#fff;font-weight:700}
button.sec{background:var(--card);border:1px solid var(--border);color:var(--text)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
input{font:inherit;width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.tela{display:none;min-height:100%;padding:24px 16px;max-width:560px;margin:0 auto}
.tela.ativa{display:block}
h1{font-size:1.5rem;margin-bottom:6px}
.muted{color:var(--muted);font-size:.9rem;line-height:1.45}
.col{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.big{font-size:1.25rem;padding:22px}
.aviso{background:#3d3113;color:#ffd66e;border-radius:12px;padding:12px;font-size:.9rem;line-height:1.4}
.erro{background:#3a1512;color:#ff9a93;border-radius:12px;padding:12px;font-size:.9rem}
a{color:var(--accent)}

/* ---------- TV ---------- */
#tv{display:none;position:fixed;inset:0;background:#000;color:#fff}
#tv.ativa{display:block}
#tvPalco{position:absolute;inset:0}
#tvVideo{position:absolute;inset:0;background:#000}
#tvVideo iframe,#tvVideo #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
#tvJogadores{position:absolute;right:2vh;top:2vh;bottom:9vh;width:30vw;display:flex;flex-direction:column;justify-content:center;gap:2.5vh;z-index:4;pointer-events:none}
#tv.esq #tvJogadores{right:auto;left:2vh}
#tv.baixo #tvJogadores{left:2vh;right:2vh;top:auto;bottom:2vh;width:auto;height:34vh;flex-direction:row;justify-content:center}
#tv.baixo .tile{flex:0 1 50vh;max-height:none;height:100%}
#tv.grande #tvJogadores{width:44vw}
.tile{position:relative;flex:1;min-height:0;max-height:46vh;border-radius:2vh;overflow:hidden;background:#000;border:.5vh solid #fff;box-shadow:0 0 3vh .5vh var(--neon,#ff2bd6);transition:box-shadow .25s}
.tile video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:brightness(var(--luz,1.15)) contrast(var(--contraste,1.15)) saturate(var(--sat,1.9)) hue-rotate(var(--hue,0deg)) invert(var(--inv,0))}
.tile .brilho{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 60%,var(--neon,#ff2bd6) 0%,transparent 70%);opacity:0}
.tile .disco{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 50%,transparent 38%,var(--c1,#f0f) 100%),linear-gradient(var(--ang,0deg),var(--c1,#f0f) 0%,transparent 35%,transparent 65%,var(--c2,#0ff) 100%);opacity:0}
.tile .mais{position:absolute;font-size:5vh;font-weight:900;color:#fff;text-shadow:0 0 1.5vh var(--neon,#ff2bd6),0 0 .4vh #000;animation:sobe 1.1s ease-out forwards;pointer-events:none}
@keyframes sobe{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-14vh) scale(1.4)}}
.tile .combo{position:absolute;left:0;right:0;top:1.5vh;text-align:center;font-size:4vh;font-weight:900;color:#fff;text-shadow:0 0 2vh var(--neon,#ff2bd6),0 0 .5vh #000;opacity:0;transition:opacity .3s}
.tile.quente .combo{opacity:1}
#tvFx{position:absolute;right:0;top:0;bottom:0;width:calc(30vw + 10vh);z-index:5;pointer-events:none}
#tv.esq #tvFx{right:auto;left:0}
#tv.baixo #tvFx{left:0;right:0;top:auto;bottom:0;width:auto;height:44vh}
#tv.grande #tvFx{width:calc(44vw + 10vh)}
#tvFlash{position:absolute;inset:0;z-index:6;pointer-events:none;background:#fff;opacity:0;transition:opacity .18s;display:none}
.tile .nome{position:absolute;left:0;right:0;bottom:0;padding:1.2vh 1.6vh;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:3vh;font-weight:800;display:flex;justify-content:space-between;align-items:flex-end}
.tile .pontos{font-size:4.5vh;color:#ffd66e}
.tile .barra{position:absolute;left:0;top:0;bottom:0;width:1.2vh;background:#222}
.tile .barra i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ok);transition:height .15s}
.tile.off{opacity:.35}
.tile.composto video{filter:none !important;transform:none}
.tile.composto .brilho,.tile.composto .disco{display:none}
#tvCapa{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:4vh;background:radial-gradient(ellipse at center,#1a2c4e 0%,#000 70%)}
#tvCapa .codigo{font-size:18vh;font-weight:900;letter-spacing:2vh;line-height:1;color:#ffd66e}
#tvCapa p{font-size:3vh;color:#cfd3d8;max-width:80vw;line-height:1.4}
#tvCapa .url{font-size:3.2vh;color:#fff;font-weight:700;background:#1a1d24;padding:1.5vh 3vh;border-radius:2vh}
#tvRodape{position:absolute;left:2vh;bottom:2vh;z-index:6;display:flex;gap:1.5vh;align-items:center;max-width:64vw}
#tvCanto{font-size:2.6vh;font-weight:800;background:rgba(0,0,0,.65);padding:1vh 2vh;border-radius:1.5vh;color:#ffd66e;white-space:nowrap}
#tvTitulo{font-size:2.4vh;background:rgba(0,0,0,.65);padding:1vh 2vh;border-radius:1.5vh;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:none}
#tv.baixo #tvRodape{bottom:auto;top:2vh}
#tvFim{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:rgba(0,0,0,.88);text-align:center}
#tvFim.ativa{display:flex}
#tvCarga{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2vh;overflow:hidden;background:#000}
#tvCarga.ativa{display:flex}
#tvCarga .fundo{position:absolute;inset:-20%;background:conic-gradient(from 0deg,#ff2bd6,#ffd60a,#2bff88,#2bb5ff,#b52bff,#ff2bd6);animation:gira 6s linear infinite;opacity:.55;filter:blur(6vh)}
#tvCarga .pisca{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,#fff 0,transparent 30%),radial-gradient(circle at 70% 60%,#fff 0,transparent 25%);mix-blend-mode:overlay;animation:piscaFundo .5s steps(2) infinite;opacity:.35}
#tvCarga .anel{position:relative;width:34vh;height:34vh}
#tvCarga .anel svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#tvCarga .anel circle{fill:none;stroke-width:3.2;stroke-linecap:round}
#tvCarga .anel .trilho{stroke:rgba(255,255,255,.18)}
#tvCarga .anel .barra{stroke:#fff;stroke-dasharray:100 100;stroke-dashoffset:100;transition:stroke-dashoffset .25s;filter:drop-shadow(0 0 1.5vh #fff)}
#tvCarga .dancante{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15vh;animation:danca .6s ease-in-out infinite alternate}
#tvCarga .pct{position:relative;font-size:8vh;font-weight:900;color:#fff;text-shadow:0 0 2vh #000}
#tvCarga .msg{position:relative;font-size:3.2vh;color:#fff;text-shadow:0 0 1vh #000;max-width:80vw;text-align:center}
#tvCarga .emojis{position:absolute;inset:0;pointer-events:none;font-size:6vh}
#tvCarga .emojis span{position:absolute;animation:sobeEmoji 2.6s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes piscaFundo{to{opacity:.12}}
@keyframes danca{0%{transform:rotate(-12deg) scale(.95) translateY(1vh)}100%{transform:rotate(12deg) scale(1.1) translateY(-1vh)}}
@keyframes sobeEmoji{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(-80vh) rotate(60deg);opacity:0}}
#tvFim h2{font-size:9vh;color:#ffd66e}
#tvFim .lista{font-size:4.5vh;line-height:1.6}

/* ---------- Celular ---------- */
.topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.95rem}
.painel{display:flex;gap:10px;margin-top:10px;align-items:stretch}
.camBox{position:relative;flex:0 0 46%;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam.frente{transform:scaleX(-1)}
#comp{position:absolute;inset:0;width:100%;height:100%;display:none}
#jogo.comp #comp{display:block}
#jogo.solo .painel{flex-direction:column}
#jogo.solo .camBox{flex:0 0 auto;aspect-ratio:16/9}
#jogo.solo #plPosicao,#jogo.solo #btComp{display:none}
.ytSolo{display:none;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-top:10px}
#jogo.solo .ytSolo{display:block}
.ytSolo iframe{width:100%;height:100%;border:0}
.camNome{position:absolute;left:0;right:0;bottom:0;font-size:.7rem;padding:3px 6px;background:rgba(0,0,0,.6);color:#cfd3d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lado{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.ctl button{font-size:1.5rem;padding:12px 0}
.zoomBox{display:flex;align-items:center;gap:8px;flex:1}
.zoomBox input{flex:1;padding:0;height:28px}
details{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 12px}
details summary{padding:12px 0;font-weight:700;cursor:pointer;list-style:none}
details summary::before{content:'▸ ';color:var(--muted)}
details[open] summary::before{content:'▾ '}
details .col{margin-top:0;padding-bottom:12px}
.energia{height:14px;background:var(--card);border-radius:7px;overflow:hidden;border:1px solid var(--border)}
.energia i{display:block;height:100%;width:0;background:var(--ok);transition:width .15s}
.placar{display:flex;flex-direction:column;gap:6px}
.placar div{display:flex;justify-content:space-between;background:var(--card);padding:6px 10px;border-radius:8px;font-weight:700;font-size:.9rem;gap:6px}
.placar div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.placar b{color:#ffd66e}
.status{font-size:.85rem;color:var(--muted)}
.status.ok{color:#7ee2a0}
button.fx.ativo,button.pos.ativo,#btGrande.ativo{border-color:var(--accent);background:#1a2c4e}
.hist button.atual{border-color:#ffd66e;color:#ffd66e}
.resultado{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;cursor:pointer}
.resultado img{width:96px;height:54px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:#000}
.resultado div{font-size:.85rem;line-height:1.3;overflow:hidden}
.resultado small{color:var(--muted)}
.hist button{text-align:left;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;width:100%}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:24px 0 8px}
</style>
</head>
<body>

<!-- ===== Escolha do papel ===== -->
<section id="inicio" class="tela ativa" data-recurso="danca-na-sala">
  <h1>💃 <span data-t="Dança na Sala|Living Room Dance"></span></h1>
  <p class="muted" data-t="A TV toca a música do YouTube e mostra quem está dançando. O celular filma, mede a energia e comanda tudo. Nada para instalar.|The TV plays the YouTube song and shows who is dancing. The phone films, measures energy and runs the show. Nothing to install."></p>
  <div class="col">
    <p id="detectouTV" class="aviso" style="display:none" data-t="📺 Parece que isto é uma TV. Aperte OK no controle para começar (da próxima vez entra sozinho).|📺 This looks like a TV. Press OK on the remote to start (next time it starts by itself)."></p>
    <button class="big" id="btTV">📺 <span data-t="Esta é a TV|This is the TV"></span></button>
    <button class="big sec" id="btCel">📱 <span data-t="Este é o celular|This is the phone"></span></button>
    <button class="big sec" id="btSolo">🎧 <span data-t="Só o celular (sem TV)|Phone only (no TV)"></span></button>
  </div>
  <p class="muted" style="margin-top:18px" data-t="Como usar: 1) na TV, abra esta página no navegador e aperte “Esta é a TV”. 2) No celular, abra a mesma página, aperte “Este é o celular”, digite o nome e o código que a TV mostra. 3) Apoie o celular virado para quem vai dançar.|How to: 1) on the TV, open this page in its browser and press “This is the TV”. 2) On the phone, open the same page, press “This is the phone”, type a name and the code the TV shows. 3) Prop the phone facing the dancers."></p>
  <footer>Dança na Sala <span id="ver"></span> · FeatureTesting · SolverONE</footer>
</section>

<section id="desligado" class="tela">
  <h1>💤</h1>
  <p class="muted" data-t="Este experimento está desligado no momento.|This experiment is switched off right now."></p>
</section>

<!-- ===== TV ===== -->
<div id="tv">
  <div id="tvRodape"><div id="tvCanto"></div><div id="tvTitulo"></div></div>
  <div id="tvPalco">
    <div id="tvVideo"><div id="yt"></div></div>
    <canvas id="tvFx"></canvas>
    <div id="tvJogadores"></div>
  </div>
  <div id="tvFlash"></div>
  <div id="tvCapa">
    <p data-t="No celular, abra|On the phone, open"></p>
    <div class="url" id="tvUrl"></div>
    <p data-t="aperte “Este é o celular” e digite o código:|press “This is the phone” and type the code:"></p>
    <div class="codigo" id="tvCodigo">····</div>
    <p id="tvEspera" class="muted" style="font-size:2.4vh" data-t="Esperando os celulares…|Waiting for phones…"></p>
  </div>
  <div id="tvFim"><h2>🏆</h2><div class="lista" id="tvRanking"></div></div>
  <div id="tvCarga">
    <div class="fundo"></div><div class="pisca"></div><div class="emojis" id="cargaEmojis"></div>
    <div class="anel"><svg viewBox="0 0 36 36"><circle class="trilho" cx="18" cy="18" r="15.9"/><circle class="barra" id="cargaBarra" cx="18" cy="18" r="15.9" pathLength="100"/></svg><div class="dancante" id="cargaDancante">💃</div></div>
    <div class="pct" id="cargaPct">0%</div>
    <div class="msg" id="cargaMsg"></div>
  </div>
</div>

<!-- ===== Celular: entrar ===== -->
<section id="entrar" class="tela">
  <h1>📱 <span data-t="Entrar na sala|Join the room"></span></h1>
  <div class="col">
    <input id="nome" maxlength="14" autocomplete="off" data-ph="Seu nome (ex.: Ana)|Your name (e.g. Ana)">
    <input id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;font-size:1.6rem;letter-spacing:.3em;text-align:center" data-ph="CÓDIGO DA TV|TV CODE">
    <button class="big" id="btEntrar" data-t="Entrar e ligar a câmera|Join and start the camera"></button>
    <div id="entrarErro" class="erro" style="display:none"></div>
  </div>
</section>

<!-- ===== Celular: jogando ===== -->
<section id="jogo" class="tela">
  <div class="topo"><b id="jogoNome"></b> · <span id="jogoCodigo" style="color:#ffd66e;font-weight:800"></span> <span class="status" id="jogoStatus"></span></div>
  <div class="ytSolo"><div id="ytSolo"></div></div>
  <div class="painel">
    <div class="camBox"><video id="cam" autoplay muted playsinline></video><canvas id="comp" width="640" height="360"></canvas><div class="camNome" id="camNome"></div></div>
    <div class="lado">
      <div class="energia" title="energia"><i id="energiaBarra"></i></div>
      <div class="placar" id="placar"></div>
    </div>
  </div>
  <div class="col" style="margin-top:10px">
    <div class="row">
      <button class="sec" id="btCamera" style="flex:0 0 auto">🔄 <span data-t="Câmera|Camera"></span></button>
      <div class="zoomBox" id="zoomBox" style="display:none">🔍 <input type="range" id="zoom"><span id="zoomVal" class="muted" style="font-size:.8rem"></span></div>
    </div>
    <div class="row ctl">
      <button class="sec" id="btAnterior" title="Anterior" disabled>⏪</button>
      <button class="sec" id="btPausa" title="Pausar / continuar">⏯️</button>
      <button class="sec" id="btReiniciar" title="Do início">⏮️</button>
      <button class="sec" id="btProxima" title="Próxima" disabled>⏩</button>
    </div>
    <div class="row">
      <input id="link" inputmode="url" data-ph="Link do YouTube (vídeo ou playlist)|YouTube link (video or playlist)">
      <button id="btTocarLink" style="flex:0 0 auto">▶️ <span data-t="Tocar|Play"></span></button>
    </div>
    <details open>
      <summary data-t="🎵 Músicas|🎵 Songs"></summary>
      <div class="col">
        <div class="row">
          <input id="busca" data-ph="🔎 Procurar música (ex.: Katy Perry)|🔎 Search a song (e.g. Katy Perry)">
          <button id="btBuscarApp" style="flex:0 0 auto" data-t="Buscar|Search"></button>
        </div>
        <div class="col" id="buscaResultados" style="gap:6px;margin-top:0"></div>
        <div id="chaveBox" class="col" style="gap:6px;margin-top:0;display:none">
          <div class="aviso" data-t="Para buscar aqui dentro, o YouTube exige uma chave sua (grátis, 100 buscas por dia). Ela fica só neste celular. Como criar: 1) abra console.cloud.google.com e entre com sua conta Google; 2) crie um projeto; 3) menu “APIs e serviços” → “Biblioteca” → procure “YouTube Data API v3” → Ativar; 4) “Credenciais” → “Criar credenciais” → “Chave de API” → copiar; 5) cole aqui.|Searching inside the app needs your own YouTube key (free, 100 searches a day). It stays on this phone only. How: 1) open console.cloud.google.com and sign in; 2) create a project; 3) “APIs & Services” → “Library” → search “YouTube Data API v3” → Enable; 4) “Credentials” → “Create credentials” → “API key” → copy; 5) paste it here."></div>
          <div class="row"><input id="chaveYT" autocomplete="off" data-ph="Cole a chave AIza…|Paste the AIza… key"><button class="sec" id="btChaveYT" style="flex:0 0 auto" data-t="Guardar|Save"></button></div>
          <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener" class="muted" data-t="Abrir a página da YouTube Data API no Google Cloud ↗|Open the YouTube Data API page on Google Cloud ↗"></a>
        </div>
        <div class="muted" data-t="📚 Playlists prontas (toque para tocar)|📚 Ready-made playlists (tap to play)"></div>
        <div class="hist col" id="sugestoes" style="gap:6px;margin-top:0"></div>
        <div class="hist col" id="plLista" style="gap:6px;margin-top:0;display:none"></div>
        <div class="hist col" id="hist" style="gap:6px;margin-top:0"></div>
        <button class="sec" id="btBuscar" data-t="↗ Abrir a busca no app do YouTube (depois use Compartilhar)|↗ Open the search in the YouTube app (then use Share)"></button>
      </div>
    </details>
    <details>
      <summary data-t="✨ Efeitos na TV|✨ TV effects"></summary>
      <div class="col">
        <div class="row">
          <button class="sec fx" data-fx="off" data-t="Sem|Off"></button>
          <button class="sec fx ativo" data-fx="suave" data-t="Suave|Soft"></button>
          <button class="sec fx" data-fx="forte" data-t="Forte 🎆|Strong 🎆"></button>
        </div>
        <p class="muted" data-t="⚠️ “Forte” faz a TV piscar luzes. Evite se alguém em casa tiver epilepsia ou sensibilidade a luzes.|⚠️ “Strong” flashes lights on the TV. Avoid it if anyone at home has epilepsy or light sensitivity."></p>
        <button class="sec" id="btComp" data-t="🎨 Transmitir já com os efeitos (mais sincronizado)|🎨 Send the video with effects baked in (more in sync)"></button>

    ctx.globalCompositeOperation = 'lighter';
    comp.mov.forEach(function (p) {
      var x = (1 - p[0]) * W, y = p[1] * H, f = p[2] / 100;
      if (comp.parts.length < 900) comp.parts.push({ x: x, y: y, vx: 0, vy: 0, g: 0, vida: 14, tam: 10 + f * 16, cor: 'hsla(' + h + ',100%,70%,.55)' });
      if (f > 0.7 && Math.random() < (forte ? 0.12 : 0.07) * dt) { for (var q = 0, nq = 30; q < nq && comp.parts.length < 900; q++) { var aq = Math.random() * Math.PI * 2, vq = 1.5 + Math.random() * 4.5; comp.parts.push({ x: x, y: y, vx: Math.cos(aq) * vq, vy: Math.sin(aq) * vq, g: 0.06, vida: 40 + Math.random() * 35, tam: 2 + Math.random() * 3, cor: 'hsl(' + (h + Math.random() * 60) + ',100%,' + (55 + Math.random() * 30) + '%)' }); } }
      for (var j = 0, n = Math.round(f * (forte ? 12 : 7)); j < n && comp.parts.length < 900; j++) {
        var a = Math.random() * Math.PI * 2, vel = 0.8 + Math.random() * 2.5;
        comp.parts.push({ x: x, y: y, vx: Math.cos(a) * vel, vy: Math.sin(a) * vel - 0.8, g: 0.03, vida: 18 + Math.random() * 18, tam: 2 + Math.random() * 3, cor: 'hsl(' + (h + Math.random() * 60) + ',100%,' + (65 + Math.random() * 25) + '%)' });
      }
      if (f > 0.5 && Math.random() < 0.025 * dt) comp.textos.push({ x: x, y: y, t: ['✨', '💫', '⚡', '🎵', '💖', '🌈'][Math.floor(Math.random() * 6)], vida: 70 });
    });
    // fogos pela energia geral
    if (Math.random() < Math.pow(e / 100, 2) * (forte ? 0.32 : 0.16) * dt && comp.parts.length < 900) {
      var fx0 = Math.random() * W, fy0 = Math.random() * H, nn = 28 + Math.floor(Math.random() * 16), hh = (h + Math.random() * 60 - 30 + 360) % 360;
      for (var i2 = 0; i2 < nn; i2++) { var a2 = Math.random() * Math.PI * 2, v2 = 1.5 + Math.random() * 4.5; comp.parts.push({ x: fx0, y: fy0, vx: Math.cos(a2) * v2, vy: Math.sin(a2) * v2, g: 0.06, vida: 40 + Math.random() * 35, tam: 2 + Math.random() * 3, cor: 'hsl(' + (hh + Math.random() * 40) + ',100%,' + (55 + Math.random() * 30) + '%)' }); }
    }
    for (var i = comp.parts.length - 1; i >= 0; i--) {
      var p2 = comp.parts[i];
      p2.x += p2.vx * dt; p2.y += p2.vy * dt; p2.vy += p2.g * dt; p2.vx *= 0.985; p2.vida -= dt;
      if (p2.vida <= 0 || p2.y > H + 10) { comp.parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, Math.min(1, p2.vida / 25)); ctx.fillStyle = p2.cor;
      if (p2.tam > 6) { ctx.beginPath(); ctx.arc(p2.x, p2.y, p2.tam / 2, 0, 6.2832); ctx.fill(); } else ctx.fillRect(p2.x, p2.y, p2.tam, p2.tam);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    // 4) pontinhos e frases de combo
    if (e > 45 && ts - comp.ultimoMais > (forte ? 350 : 600)) { comp.ultimoMais = ts; comp.textos.push({ x: 60 + Math.random() * (W - 120), y: H * 0.4 + Math.random() * H * 0.3, t: (modo.solo ? solo.tocando : true) ? '+' + Math.round(e / 10) : ['✨', '💥', '⭐', '🔥'][Math.floor(Math.random() * 4)], vida: 70, grande: true }); }
    if (e > 65) { comp.quenteDesde = comp.quenteDesde || ts; if (ts - comp.quenteDesde > 1500 && ts > comp.fraseAte) { comp.frase = (EN ? ['🔥 ON FIRE!', '⭐ AMAZING!', '💃 GO GO GO!', '🎉 WOW!'] : ['🔥 PEGANDO FOGO!', '⭐ ARRASOU!', '💃 VAI VAI VAI!', '🎉 UAU!'])[Math.floor(Math.random() * 4)]; comp.fraseAte = ts + 2500; } }
    else if (e < 40) comp.quenteDesde = 0;
    ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.7)';
    for (var k = comp.textos.length - 1; k >= 0; k--) {
      var tx = comp.textos[k]; tx.vida -= dt; tx.y -= 1.2 * dt;
      if (tx.vida <= 0) { comp.textos.splice(k, 1); continue; }
      ctx.globalAlpha = Math.min(1, tx.vida / 30); ctx.font = '900 ' + (tx.grande ? 36 : 30) + 'px system-ui,sans-serif'; ctx.fillStyle = '#fff';
      ctx.strokeText(tx.t, tx.x, tx.y); ctx.fillText(tx.t, tx.x, tx.y);
    }
    ctx.globalAlpha = 1;
    if (ts < comp.fraseAte) { ctx.font = '900 34px system-ui,sans-serif'; ctx.fillStyle = '#fff'; ctx.shadowColor = neon; ctx.shadowBlur = 18; ctx.strokeText(comp.frase, W / 2, 48); ctx.fillText(comp.frase, W / 2, 48); ctx.shadowBlur = 0; }
  }
  // 5) no modo solo, o placar vai na própria imagem
  if (modo.solo) {
    ctx.font = '800 22px system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, H - 40, W, 40);
    ctx.fillStyle = '#fff'; ctx.fillText(cel.nome, 12, H - 12); ctx.textAlign = 'right'; ctx.fillStyle = '#ffd66e'; ctx.font = '900 28px system-ui,sans-serif'; ctx.fillText(Math.round(solo.pontos), W - 12, H - 10);
  }
}

/* ---------- Só o celular: o YouTube toca aqui mesmo ---------- */
var solo = { player: null, tocando: false, titulo: '', lista: [], indice: -1, pontos: 0, videoAtual: '', timer: 0, pendente: null };
function soloIniciar() {
  solo.pontos = 0;
  apiYouTube(function () {
    if (solo.player) return;
    solo.player = new YT.Player('ytSolo', {
      width: '100%', height: '100%', playerVars: { autoplay: 0, controls: 1, rel: 0, modestbranding: 1, playsinline: 1, origin: location.origin },
      events: {
        onReady: function () { if (solo.pendente) { var m = solo.pendente; solo.pendente = null; soloComando(m); } },
        onStateChange: function (ev) {
          var p = solo.player; solo.tocando = (ev.data === YT.PlayerState.PLAYING);
          try { solo.lista = p.getPlaylist() || []; solo.indice = p.getPlaylistIndex(); } catch (e) { solo.lista = []; solo.indice = -1; }
          if (ev.data === YT.PlayerState.PLAYING) { var d = p.getVideoData ? p.getVideoData() : null, id = d && d.video_id; if (id && id !== solo.videoAtual) { solo.videoAtual = id; solo.titulo = d.title || id; solo.pontos = 0; } }
          if (ev.data === YT.PlayerState.ENDED) comp.textos.push({ x: 320, y: 200, t: '🏆 ' + Math.round(solo.pontos), vida: 240, grande: true });
        },
        onError: function (ev) { status(T('Esse clipe não toca aqui. Pulando…', 'That clip cannot play here. Skipping…'), 'erro'); try { if ((solo.player.getPlaylist() || []).length > 1) setTimeout(function () { solo.player.nextVideo(); }, 1500); } catch (e) {} }
      }
    });
  });
  clearInterval(solo.timer);
  solo.timer = setInterval(function () { var pts = {}; pts[cel.id] = { nome: cel.nome, pontos: Math.round(solo.pontos) }; mostrarEstado({ tocando: solo.tocando, titulo: solo.titulo, pontos: pts, lista: solo.lista, indice: solo.indice }); }, 1000);
}
function soloComando(m) {
  var p = solo.player;
  if (m.acao === 'efeitos') { comp.modo = m.modo; return; }
  if (!p || !p.loadVideoById) { if (m.acao === 'carregar' || m.acao === 'playlist') solo.pendente = m; return; }
  if (m.acao === 'carregar' && m.video) { solo.pontos = 0; solo.titulo = m.titulo || m.video; solo.videoAtual = m.video; p.loadVideoById(m.video); p.playVideo(); }
  else if (m.acao === 'playlist' && m.lista) { solo.pontos = 0; p.loadPlaylist({ list: m.lista, listType: 'playlist', index: 0 }); p.playVideo(); }
  else if (m.acao === 'indice') { solo.pontos = 0; p.playVideoAt(+m.i || 0); }
  else if (m.acao === 'proxima') { solo.pontos = 0; p.nextVideo(); }
  else if (m.acao === 'anterior') { solo.pontos = 0; p.previousVideo(); }
  else if (m.acao === 'pausa') { if (p.getPlayerState() === YT.PlayerState.PLAYING) p.pauseVideo(); else p.playVideo(); }
  else if (m.acao === 'reiniciar') { solo.pontos = 0; p.seekTo(0, true); p.playVideo(); }
}

/* Busca dentro do app: usa a YouTube Data API com a chave da própria pessoa, guardada só neste
   celular (localStorage). Nenhuma chave entra no código nem sai para outro lugar além do Google. */
function chaveYT() { try { return localStorage.getItem('danca:ytkey') || ''; } catch (e) { return ''; } }
$('btChaveYT').onclick = function () { var k = $('chaveYT').value.trim(); if (!/^AIza[0-9A-Za-z_-]{20,}$/.test(k)) { alert(T('Essa não parece uma chave do Google (começa com AIza).', 'That does not look like a Google key (starts with AIza).')); return; } try { localStorage.setItem('danca:ytkey', k); } catch (e) {} $('chaveYT').value = ''; $('chaveBox').style.display = 'none'; buscarNoApp(); };
function buscarNoApp() {
  var q = $('busca').value.trim(), out = $('buscaResultados');
  if (!q) return;
  var k = chaveYT();
  if (!k) { $('chaveBox').style.display = ''; return; }
  out.innerHTML = '<div class="muted">' + T('Buscando…', 'Searching…') + '</div>';
  var base = 'https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&safeSearch=strict&key=' + encodeURIComponent(k) + '&q=' + encodeURIComponent(q);
  Promise.all([
    fetch(base + '&type=video&videoEmbeddable=true').then(function (r) { return r.json(); }),
    fetch(base + '&type=playlist&maxResults=4').then(function (r) { return r.json(); }).catch(function () { return {}; })
  ]).then(function (rs) {
    var v = rs[0], pl = rs[1];
    if (v.error) { out.innerHTML = '<div class="erro">' + T('O Google recusou a chave (', 'Google refused the key (') + escapar(v.error.message || v.error.code) + ').' + T(' Confira se a YouTube Data API v3 está ativada, ou se acabou a cota do dia.', ' Check that YouTube Data API v3 is enabled, or the daily quota ran out.') + '</div>'; if (v.error.code === 400 || v.error.code === 403) { try { localStorage.removeItem('danca:ytkey'); } catch (e) {} $('chaveBox').style.display = ''; } return; }
    out.innerHTML = '';
    var itens = (pl.items || []).concat(v.items || []);
    if (!itens.length) { out.innerHTML = '<div class="muted">' + T('Nada encontrado.', 'Nothing found.') + '</div>'; return; }
    itens.forEach(function (it) {
      var ehPl = it.id.kind === 'youtube#playlist', id = ehPl ? it.id.playlistId : it.id.videoId, sn = it.snippet || {};
      var d = document.createElement('div'); d.className = 'resultado';
      d.innerHTML = '<img alt=""><div><b></b><br><small></small></div>';
      d.querySelector('img').src = (sn.thumbnails && (sn.thumbnails.medium || sn.thumbnails.default) || {}).url || '';
      d.querySelector('b').textContent = (ehPl ? '📜 ' : '🎵 ') + decodificar(sn.title || id);
      d.querySelector('small').textContent = decodificar(sn.channelTitle || '');
      d.onclick = function () { tocarLink(ehPl ? 'https://www.youtube.com/playlist?list=' + id : id); window.scrollTo(0, 0); };
      out.appendChild(d);
    });
  }).catch(function (e) { out.innerHTML = '<div class="erro">' + T('Não deu para buscar: ', 'Search failed: ') + escapar(e.message || e) + '</div>'; });
}
function decodificar(t) { var x = document.createElement('textarea'); x.innerHTML = t; return x.value; }
$('btBuscarApp').onclick = buscarNoApp;
$('busca').addEventListener('keydown', function (e) { if (e.key === 'Enter') buscarNoApp(); });
try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js'); } catch (e) {}

/* Atalho: ?tv abre direto a tela de escolha com foco no botão da TV (para apertar OK no controle). */
/* Link que chegou pelo "Compartilhar" do YouTube (Web Share Target do manifesto): entra no campo e,
   se nome e código já são conhecidos, já entra na sala com ele. */
var compartilhado = (location.search.match(/[?&](?:link|text|url)=([^&]+)/) || []).map(decodeURIComponent)[1] || '';
if (compartilhado && (idYouTube(compartilhado) || idPlaylist(compartilhado))) {
  history.replaceState(null, '', location.pathname);
  $('btCel').click();
  $('link').value = compartilhado;
  if ($('nome').value && $('codigo').value) { entrar(); var esperaTV = setInterval(function () { if (cel.tvViu && $('jogo').classList.contains('ativa')) { clearInterval(esperaTV); tocarLink(compartilhado); } }, 500); setTimeout(function () { clearInterval(esperaTV); }, 20000); }
}
/* Controle remoto: setas para cima/baixo (ou esquerda/direita) trocam o botão selecionado na tela
   ativa, OK (Enter) aciona. O navegador da LG nem sempre faz isso sozinho quando o cursor some. */
document.addEventListener('keydown', function (e) {
  var k = e.key, dir = (k === 'ArrowDown' || k === 'ArrowRight') ? 1 : (k === 'ArrowUp' || k === 'ArrowLeft') ? -1 : 0;
  if (!dir) return;
  var tela0 = document.querySelector('.tela.ativa'); if (!tela0) return;
  var focaveis = Array.prototype.filter.call(tela0.querySelectorAll('button, input, [tabindex]'), function (el) { return !el.disabled && el.offsetParent !== null; });
  if (!focaveis.length) return;
  var i = focaveis.indexOf(document.activeElement), prox = focaveis[(i + dir + focaveis.length) % focaveis.length];
  if (prox && !(document.activeElement && document.activeElement.tagName === 'INPUT' && dir && k !== 'ArrowUp' && k !== 'ArrowDown')) { e.preventDefault(); prox.focus(); }
});

/* Detecta TV: o navegador das smart TVs se identifica (LG = "Web0S"/"webOS", Samsung = "Tizen"/"SMART-TV").
   Primeira vez: foca o botão da TV (um OK no controle basta). Depois que a TV entrou uma vez, entra sozinha. */
var pareceTV = /Web0S|webOS|SMART-TV|SmartTV|Tizen|NetCast|BRAVIA|AFT[A-Z]|CrKey|Android TV|GoogleTV|HbbTV|Roku|VIDAA|Philips.*TV/i.test(navigator.userAgent);
var papelSalvo = ''; try { papelSalvo = localStorage.getItem('danca:papel') || ''; } catch (e) {}
if (/[?&]tv=auto\b/.test(location.search) || (pareceTV && papelSalvo === 'tv' && !/[?&]escolher\b/.test(location.search))) iniciarTV();
else if (pareceTV) { $('detectouTV').style.display = 'block'; $('btTV').focus(); }   // aberto pelo app da LG: já entra como TV
else if (/[?&]tv\b/.test(location.search)) $('btTV').focus();
})();
