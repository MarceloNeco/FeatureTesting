<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dança na Sala — FeatureTesting</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💃</text></svg>">
<link rel="manifest" href="danca-na-sala.webmanifest">
<link rel="apple-touch-icon" href="danca-na-sala-icone.png">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<!--
  Dança na Sala / Living Room Dance — experimento do FeatureTesting (SolverONE)

  A MESMA página serve a TV e o celular:
    TV      → abre no navegador da TV, aperta "Esta é a TV", mostra um código de 4 letras.
    Celular → abre a mesma página, digita nome e código, liga a câmera.
  O celular manda o vídeo da câmera para a TV direto pelo Wi-Fi (WebRTC, ponto a ponto: por isso
  não tem atraso) e mede quanto a pessoa se mexe (diferença entre quadros, sem IA). A TV toca a
  música do YouTube, mostra as câmeras e o placar. Os comandos (tocar, pausar, trocar música)
  saem do celular. Celular e TV se encontram pelo Supabase Realtime da plataforma (só mensagens
  pequenas; nenhum vídeo passa pelo servidor; chave publishable, pública por desenho).
-->
<style>
:root{--bg:#0f1115;--card:#1a1d24;--text:#e8eaed;--muted:#9aa0a6;--border:#2a2f3a;--accent:#4285f4;--ok:#34a853;--warn:#f9ab00;--danger:#ea4335}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 18px;background:var(--accent);color:#fff;font-weight:700}
button.sec{background:var(--card);border:1px solid var(--border);color:var(--text)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
input{font:inherit;width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.tela{display:none;min-height:100%;padding:24px 16px;max-width:560px;margin:0 auto}
.tela.ativa{display:block}
h1{font-size:1.5rem;margin-bottom:6px}
.muted{color:var(--muted);font-size:.9rem;line-height:1.45}
.col{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.big{font-size:1.25rem;padding:22px}
.aviso{background:#3d3113;color:#ffd66e;border-radius:12px;padding:12px;font-size:.9rem;line-height:1.4}
.erro{background:#3a1512;color:#ff9a93;border-radius:12px;padding:12px;font-size:.9rem}
a{color:var(--accent)}

/* ---------- TV ---------- */
#tv{display:none;position:fixed;inset:0;background:#000;color:#fff}
#tv.ativa{display:block}
#tvPalco{position:absolute;inset:0}
#tvVideo{position:absolute;inset:0;background:#000}
#tvVideo iframe,#tvVideo #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
#tvJogadores{position:absolute;right:2vh;top:2vh;bottom:9vh;width:30vw;display:flex;flex-direction:column;justify-content:center;gap:2.5vh;z-index:4;pointer-events:none}
#tv.esq #tvJogadores{right:auto;left:2vh}
#tv.baixo #tvJogadores{left:2vh;right:2vh;top:auto;bottom:2vh;width:auto;height:34vh;flex-direction:row;justify-content:center}
#tv.baixo .tile{flex:0 1 50vh;max-height:none;height:100%}
#tv.grande #tvJogadores{width:44vw}
.tile{position:relative;flex:1;min-height:0;max-height:46vh;border-radius:2vh;overflow:hidden;background:#000;border:.5vh solid #fff;box-shadow:0 0 3vh .5vh var(--neon,#ff2bd6);transition:box-shadow .25s}
.tile video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:brightness(var(--luz,1.3)) contrast(1.2) saturate(1.7) hue-rotate(var(--hue,0deg))}
.tile .brilho{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 60%,var(--neon,#ff2bd6) 0%,transparent 70%);opacity:0;transition:opacity .2s}
.tile .mais{position:absolute;font-size:5vh;font-weight:900;color:#fff;text-shadow:0 0 1.5vh var(--neon,#ff2bd6),0 0 .4vh #000;animation:sobe 1.1s ease-out forwards;pointer-events:none}
@keyframes sobe{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-14vh) scale(1.4)}}
.tile .combo{position:absolute;left:0;right:0;top:1.5vh;text-align:center;font-size:4vh;font-weight:900;color:#fff;text-shadow:0 0 2vh var(--neon,#ff2bd6),0 0 .5vh #000;opacity:0;transition:opacity .3s}
.tile.quente .combo{opacity:1}
#tvFx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
#tvFlash{position:absolute;inset:0;z-index:6;pointer-events:none;background:#fff;opacity:0;transition:opacity .18s}
.tile .nome{position:absolute;left:0;right:0;bottom:0;padding:1.2vh 1.6vh;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:3vh;font-weight:800;display:flex;justify-content:space-between;align-items:flex-end}
.tile .pontos{font-size:4.5vh;color:#ffd66e}
.tile .barra{position:absolute;left:0;top:0;bottom:0;width:1.2vh;background:#222}
.tile .barra i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--ok);transition:height .15s}
.tile.off{opacity:.35}
#tvCapa{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;padding:4vh;background:radial-gradient(ellipse at center,#1a2c4e 0%,#000 70%)}
#tvCapa .codigo{font-size:18vh;font-weight:900;letter-spacing:2vh;line-height:1;color:#ffd66e}
#tvCapa p{font-size:3vh;color:#cfd3d8;max-width:80vw;line-height:1.4}
#tvCapa .url{font-size:3.2vh;color:#fff;font-weight:700;background:#1a1d24;padding:1.5vh 3vh;border-radius:2vh}
#tvRodape{position:absolute;left:2vh;bottom:2vh;z-index:6;display:flex;gap:1.5vh;align-items:center;max-width:64vw}
#tvCanto{font-size:2.6vh;font-weight:800;background:rgba(0,0,0,.65);padding:1vh 2vh;border-radius:1.5vh;color:#ffd66e;white-space:nowrap}
#tvTitulo{font-size:2.4vh;background:rgba(0,0,0,.65);padding:1vh 2vh;border-radius:1.5vh;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:none}
#tv.baixo #tvRodape{bottom:auto;top:2vh}
#tvFim{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:rgba(0,0,0,.88);text-align:center}
#tvFim.ativa{display:flex}
#tvFim h2{font-size:9vh;color:#ffd66e}
#tvFim .lista{font-size:4.5vh;line-height:1.6}

/* ---------- Celular ---------- */
.topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.95rem}
.painel{display:flex;gap:10px;margin-top:10px;align-items:stretch}
.camBox{position:relative;flex:0 0 46%;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam.frente{transform:scaleX(-1)}
.camNome{position:absolute;left:0;right:0;bottom:0;font-size:.7rem;padding:3px 6px;background:rgba(0,0,0,.6);color:#cfd3d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lado{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.ctl button{font-size:1.5rem;padding:12px 0}
.zoomBox{display:flex;align-items:center;gap:8px;flex:1}
.zoomBox input{flex:1;padding:0;height:28px}
details{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 12px}
details summary{padding:12px 0;font-weight:700;cursor:pointer;list-style:none}
details summary::before{content:'▸ ';color:var(--muted)}
details[open] summary::before{content:'▾ '}
details .col{margin-top:0;padding-bottom:12px}
.energia{height:14px;background:var(--card);border-radius:7px;overflow:hidden;border:1px solid var(--border)}
.energia i{display:block;height:100%;width:0;background:var(--ok);transition:width .15s}
.placar{display:flex;flex-direction:column;gap:6px}
.placar div{display:flex;justify-content:space-between;background:var(--card);padding:6px 10px;border-radius:8px;font-weight:700;font-size:.9rem;gap:6px}
.placar div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.placar b{color:#ffd66e}
.status{font-size:.85rem;color:var(--muted)}
.status.ok{color:#7ee2a0}
button.fx.ativo,button.pos.ativo,#btGrande.ativo{border-color:var(--accent);background:#1a2c4e}
.hist button.atual{border-color:#ffd66e;color:#ffd66e}
.hist button{text-align:left;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;width:100%}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:24px 0 8px}
</style>
</head>
<body>

<!-- ===== Escolha do papel ===== -->
<section id="inicio" class="tela ativa" data-recurso="danca-na-sala">
  <h1>💃 <span data-t="Dança na Sala|Living Room Dance"></span></h1>
  <p class="muted" data-t="A TV toca a música do YouTube e mostra quem está dançando. O celular filma, mede a energia e comanda tudo. Nada para instalar.|The TV plays the YouTube song and shows who is dancing. The phone films, measures energy and runs the show. Nothing to install."></p>
  <div class="col">
    <button class="big" id="btTV">📺 <span data-t="Esta é a TV|This is the TV"></span></button>
    <button class="big sec" id="btCel">📱 <span data-t="Este é o celular|This is the phone"></span></button>
  </div>
  <p class="muted" style="margin-top:18px" data-t="Como usar: 1) na TV, abra esta página no navegador e aperte “Esta é a TV”. 2) No celular, abra a mesma página, aperte “Este é o celular”, digite o nome e o código que a TV mostra. 3) Apoie o celular virado para quem vai dançar.|How to: 1) on the TV, open this page in its browser and press “This is the TV”. 2) On the phone, open the same page, press “This is the phone”, type a name and the code the TV shows. 3) Prop the phone facing the dancers."></p>
  <footer>Dança na Sala <span id="ver"></span> · FeatureTesting · SolverONE</footer>
</section>

<section id="desligado" class="tela">
  <h1>💤</h1>
  <p class="muted" data-t="Este experimento está desligado no momento.|This experiment is switched off right now."></p>
</section>

<!-- ===== TV ===== -->
<div id="tv">
  <div id="tvRodape"><div id="tvCanto"></div><div id="tvTitulo"></div></div>
  <div id="tvPalco">
    <div id="tvVideo"><div id="yt"></div></div>
    <canvas id="tvFx"></canvas>
    <div id="tvJogadores"></div>
  </div>
  <div id="tvFlash"></div>
  <div id="tvCapa">
    <p data-t="No celular, abra|On the phone, open"></p>
    <div class="url" id="tvUrl"></div>
    <p data-t="aperte “Este é o celular” e digite o código:|press “This is the phone” and type the code:"></p>
    <div class="codigo" id="tvCodigo">····</div>
    <p id="tvEspera" class="muted" style="font-size:2.4vh" data-t="Esperando os celulares…|Waiting for phones…"></p>
  </div>
  <div id="tvFim"><h2>🏆</h2><div class="lista" id="tvRanking"></div></div>
</div>

<!-- ===== Celular: entrar ===== -->
<section id="entrar" class="tela">
  <h1>📱 <span data-t="Entrar na sala|Join the room"></span></h1>
  <div class="col">
    <input id="nome" maxlength="14" autocomplete="off" data-ph="Seu nome (ex.: Ana)|Your name (e.g. Ana)">
    <input id="codigo" maxlength="4" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;font-size:1.6rem;letter-spacing:.3em;text-align:center" data-ph="CÓDIGO DA TV|TV CODE">
    <button class="big" id="btEntrar" data-t="Entrar e ligar a câmera|Join and start the camera"></button>
    <div id="entrarErro" class="erro" style="display:none"></div>
  </div>
</section>

<!-- ===== Celular: jogando ===== -->
<section id="jogo" class="tela">
  <div class="topo"><b id="jogoNome"></b> · <span id="jogoCodigo" style="color:#ffd66e;font-weight:800"></span> <span class="status" id="jogoStatus"></span></div>
  <div class="painel">
    <div class="camBox"><video id="cam" autoplay muted playsinline></video><div class="camNome" id="camNome"></div></div>
    <div class="lado">
      <div class="energia" title="energia"><i id="energiaBarra"></i></div>
      <div class="placar" id="placar"></div>
    </div>
  </div>
  <div class="col" style="margin-top:10px">
    <div class="row">
      <button class="sec" id="btCamera" style="flex:0 0 auto">🔄 <span data-t="Câmera|Camera"></span></button>
      <div class="zoomBox" id="zoomBox" style="display:none">🔍 <input type="range" id="zoom"><span id="zoomVal" class="muted" style="font-size:.8rem"></span></div>
    </div>
    <div class="row ctl">
      <button class="sec" id="btAnterior" title="Anterior" disabled>⏪</button>
      <button class="sec" id="btPausa" title="Pausar / continuar">⏯️</button>
      <button class="sec" id="btReiniciar" title="Do início">⏮️</button>
      <button class="sec" id="btProxima" title="Próxima" disabled>⏩</button>
    </div>
    <div class="row">
      <input id="link" inputmode="url" data-ph="Link do YouTube (vídeo ou playlist)|YouTube link (video or playlist)">
      <button id="btTocarLink" style="flex:0 0 auto">▶️ <span data-t="Tocar|Play"></span></button>
    </div>
    <details open>
      <summary data-t="🎵 Músicas|🎵 Songs"></summary>
      <div class="col">
        <div class="hist col" id="plLista" style="gap:6px;margin-top:0;display:none"></div>
        <div class="hist col" id="hist" style="gap:6px;margin-top:0"></div>
        <button class="sec" id="btBuscar" data-t="🔎 Procurar no YouTube|🔎 Search YouTube"></button>
      </div>
    </details>
    <details>
      <summary data-t="✨ Efeitos na TV|✨ TV effects"></summary>
      <div class="col">
        <div class="row">
          <button class="sec fx" data-fx="off" data-t="Sem|Off"></button>
          <button class="sec fx ativo" data-fx="suave" data-t="Suave|Soft"></button>
          <button class="sec fx" data-fx="forte" data-t="Forte 🎆|Strong 🎆"></button>
        </div>
        <p class="muted" data-t="⚠️ “Forte” faz a TV piscar luzes. Evite se alguém em casa tiver epilepsia ou sensibilidade a luzes.|⚠️ “Strong” flashes lights on the TV. Avoid it if anyone at home has epilepsy or light sensitivity."></p>
      </div>
    </details>
    <details>
      <summary data-t="📺 Posição na TV|📺 Position on the TV"></summary>
      <div class="col">
        <div class="row">
          <button class="sec pos ativo" data-pos="dir" data-t="Direita|Right"></button>
          <button class="sec pos" data-pos="esq" data-t="Esquerda|Left"></button>
          <button class="sec pos" data-pos="baixo" data-t="Embaixo|Bottom"></button>
        </div>
        <button class="sec" id="btGrande" data-t="🔍 Câmeras maiores|🔍 Bigger cameras"></button>
      </div>
    </details>
    <details>
      <summary data-t="⚙️ Mais|⚙️ More"></summary>
      <div class="col">
        <div class="aviso" data-t="Dica: deixe o celular apoiado, na horizontal, apontando para quem dança. A tela precisa ficar ligada. Se o celular tiver câmera grande-angular (0.5x), ela aparece no botão 🔄 Câmera.|Tip: prop the phone up, landscape, facing the dancers. The screen must stay on. If the phone has a wide-angle (0.5x) camera, it shows up under 🔄 Camera."></div>
        <button class="sec" id="btSair">🚪 <span data-t="Sair da sala|Leave the room"></span></button>
        <div class="muted" style="text-align:center;font-size:.75rem">Dança na Sala <span class="ver2"></span></div>
      </div>
    </details>
  </div>
</section>

<script src="recursos.js" data-app="feature-tester"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
'use strict';
var APP_VERSION = '0.6.0', APP_UPDATED = '30/10/2026';

/* ---------- Supabase (público por desenho; igual ao config.js do solverone-app) ---------- */
var SUPABASE_URL = 'https://qvdvkqydhnadhewcidia.supabase.co';
var SUPABASE_KEY = 'sb_publishable_oRJmeUwlBbOP_HoOXf0xLw_4O8v43EA';
var ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

/* ---------- PT / EN ---------- */
var EN = /^en/i.test(navigator.language || '');
function T(pt, en) { return EN ? en : pt; }
document.querySelectorAll('[data-t]').forEach(function (el) { var p = el.getAttribute('data-t').split('|'); el.textContent = T(p[0], p[1] || p[0]); });
document.querySelectorAll('[data-ph]').forEach(function (el) { var p = el.getAttribute('data-ph').split('|'); el.placeholder = T(p[0], p[1] || p[0]); });
document.getElementById('ver').textContent = 'v' + APP_VERSION + ' · ' + APP_UPDATED;
document.querySelectorAll('.ver2').forEach(function (e) { e.textContent = 'v' + APP_VERSION; });

var $ = function (id) { return document.getElementById(id); };
function tela(id) { document.querySelectorAll('.tela').forEach(function (s) { s.classList.toggle('ativa', s.id === id); }); }

/* Interruptor do RootifyONE: se o dono desligar "danca-na-sala", a página inteira para. */
if (window.SolverRecursos && !SolverRecursos.ligado('danca-na-sala', true)) { tela('desligado'); return; }

/* ---------- Canal (celular e TV) ---------- */
var sb = null, canal = null, CODIGO = '';
function abrirCanal(codigo, aoReceber) {
  if (!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { params: { eventsPerSecond: 20 } } });
  return new Promise(function (ok, falha) {
    var pronto = false;
    canal = sb.channel('danca-' + codigo, { config: { broadcast: { self: false } } });
    canal.on('broadcast', { event: 'm' }, function (x) { try { aoReceber(x.payload || {}); } catch (e) { console.warn(e); } });
    canal.subscribe(function (st) {
      if (st === 'SUBSCRIBED' && !pronto) { pronto = true; ok(); }
      else if ((st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') && !pronto) { pronto = true; falha(new Error(st)); }
    });
  });
}
function enviar(m) { if (canal) canal.send({ type: 'broadcast', event: 'm', payload: m }); }
function idNovo() { return Math.random().toString(36).slice(2, 10); }

/* ---------- YouTube: link → id ---------- */
function idPlaylist(s) { var m = (s || '').match(/[?&]list=([A-Za-z0-9_-]{10,})/); return m ? m[1] : ''; }
function idYouTube(s) {
  s = (s || '').trim();
  var m = s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  return '';
}

/* =====================================================================
   TV
   ===================================================================== */
var tv = { pcs: {}, tiles: {}, pontos: {}, energia: {}, quente: {}, tocando: false, player: null, titulo: '', fimMostrado: false, videoAtual: '', lista: [], indice: -1, podioAte: 0, timerPodio: 0 };

function iniciarTV() {
  var letras = 'ABCDEFGHJKLMNPRSTUVWXYZ', c = '';
  for (var i = 0; i < 4; i++) c += letras[Math.floor(Math.random() * letras.length)];
  CODIGO = c;
  tela('');
  $('tv').classList.add('ativa');
  $('tvCodigo').textContent = c;
  $('tvCanto').textContent = T('Código: ', 'Code: ') + c;
  $('tvUrl').textContent = /solverone\.com\.br$/.test(location.host) ? 'solverone.com.br/tv' : location.host + location.pathname.replace(/index\.html$/, '');
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch (e) {}

  abrirCanal(c, tvReceber).then(function () {
    enviar({ t: 'tv' });
    setInterval(tvEstado, 1500);
  }).catch(function () {
    $('tvEspera').textContent = T('Sem conexão com o servidor de pareamento. Confira a internet da TV e recarregue.', 'No connection to the pairing server. Check the TV internet and reload.');
  });
  carregarYouTube();
  fxIniciar();
  window.DancaDebug = tv;   // só para testes automáticos (nada de segredo aqui)
}

function tvReceber(m) {
  tv.ultimaMsg = m.t + (m.acao ? ':' + m.acao : '');
  if (m.t === 'join') { enviar({ t: 'tv' }); return; }
  if (m.t === 'offer') { tvNovoJogador(m); return; }
  if (m.t === 'ice' && m.to === 'tv' && tv.pcs[m.id]) { try { tv.pcs[m.id].addIceCandidate(m.c); } catch (e) {} return; }
  if (m.t === 'energia' && tv.tiles[m.id]) { tvEnergia(m.id, m.e); return; }
  if (m.t === 'sair' && tv.tiles[m.id]) { tvRemover(m.id); return; }
  if (m.t === 'cmd') { tvComando(m); return; }
}

function tvNovoJogador(m) {
  if (tv.pcs[m.id]) { try { tv.pcs[m.id].close(); } catch (e) {} }
  // o mesmo nome entrando de novo (recarregou a página) substitui o antigo, em vez de duplicar
  Object.keys(tv.tiles).forEach(function (k) { if (k !== m.id && tv.pontos[k] && tv.pontos[k].nome === m.nome) tvRemover(k); });
  var pc = new RTCPeerConnection(ICE);
  tv.pcs[m.id] = pc;
  var tile = tv.tiles[m.id] || tvTile(m.id, m.nome);
  tile.classList.remove('off');

/* --- Efeitos: neon nas câmeras, fogos e clarões, tudo puxado pela energia de quem dança.
   Canvas em 960x540 esticado para a tela (leve para o navegador da TV). Modos: off | suave | forte.
   "forte" pisca a tela inteira (no máximo ~3 vezes por segundo): aviso de fotossensibilidade no celular. --- */
var fx = { modo: 'suave', parts: [], ctx: null, hue: 0, ultimoFlash: 0, ultimoQuadro: 0, frases: null };
function fxIniciar() {
  var c = $('tvFx'); c.width = 960; c.height = 540; fx.ctx = c.getContext('2d');
  fx.frases = EN ? ['🔥 ON FIRE!', '⭐ AMAZING!', '💃 GO GO GO!', '🎉 WOW!'] : ['🔥 PEGANDO FOGO!', '⭐ ARRASOU!', '💃 VAI VAI VAI!', '🎉 UAU!'];

}

  }
}

    var h = (fx.hue + i * 120) % 360;
    t.style.setProperty('--neon', 'hsl(' + h + ',100%,60%)');
    t.style.setProperty('--hue', (tv.tocando ? Math.round(Math.sin(ts / 900 + i) * (forte ? 60 : 25) * (e / 100)) : 0) + 'deg');
    t.style.boxShadow = '0 0 ' + (2 + e / 8) + 'vh ' + (0.3 + e / 40) + 'vh hsl(' + h + ',100%,60%)';
    t.querySelector('.brilho').style.opacity = (forte ? 0.55 : 0.35) * Math.min(1, e / 70);
    // pontinhos subindo quando se mexe (com música valem pontos de verdade)
    if (e > 45 && ts - (t.ultimoMais || 0) > (forte ? 350 : 600)) { t.ultimoMais = ts; fxMais(t, tv.tocando ? '+' + Math.round(e / 10) : ['✨', '💥', '⭐', '🔥'][Math.floor(Math.random() * 4)]); }

    else if (e < 40) { delete tv.quente[k]; t.classList.remove('quente'); }
    // fogos: quanto mais energia, mais explosões perto da câmera
    if (Math.random() < Math.pow(e / 100, 2) * (forte ? 0.32 : 0.16) * (tv.tocando ? 1 : 0.4) * dt && fx.parts.length < 900) {
      var r = t.getBoundingClientRect(), sx = W / innerWidth, sy = H / innerHeight;

  }
}

}

/* Câmeras: a primeira vez pede a traseira; depois lista TODAS as câmeras do aparelho (nos Samsung a

  if (anterior) { for (var i = 0; i < d.length; i += 4) { soma += Math.abs((d[i] + d[i + 1] + d[i + 2]) - (anterior[i] + anterior[i + 1] + anterior[i + 2])); } }
  anterior = new Uint8ClampedArray(d);
  var dif = soma / n / 3;                          // 0..255, ruído da câmera ≈ 1–3
  var e = Math.max(0, Math.min(100, (dif - 2) * 4));
  suave = suave * 0.6 + e * 0.4;
  $('energiaBarra').style.width = Math.round(suave) + '%';
  var agora = Date.now();
  if (agora - ultimoEnvio > 400) { ultimoEnvio = agora; enviar({ t: 'energia', id: cel.id, e: Math.round(suave) }); }
}

/* Lista da playlist no celular: a TV manda os ids; o nome de cada música vem do YouTube (oEmbed,
   sem chave) e fica guardado no celular para não buscar de novo. */
var titulos = {}, buscandoTitulo = false;
try { titulos = JSON.parse(localStorage.getItem('danca:titulos') || '{}'); } catch (e) {}
function buscarTitulos(ids) {
  if (buscandoTitulo) return;
  var falta = ids.filter(function (id) { return !titulos[id]; });
  if (!falta.length) return;
  buscandoTitulo = true;
  fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=' + falta[0] + '&format=json')
    .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    .then(function (j) {
      titulos[falta[0]] = (j && j.title) || falta[0];
      try { localStorage.setItem('danca:titulos', JSON.stringify(titulos)); } catch (e) {}
      buscandoTitulo = false; desenharLista(cel.ultimoEstado);
      if (falta.length > 1) setTimeout(function () { buscarTitulos(ids); }, 150);
    });
}
var listaDesenhada = '';
function desenharLista(m) {
  var ids = (m && m.lista) || [], d = $('plLista');
  $('btAnterior').disabled = $('btProxima').disabled = !ids.length;
  if (!ids.length) { d.style.display = 'none'; listaDesenhada = ''; return; }
  d.style.display = '';
  var chave = ids.join(',') + '|' + m.indice + '|' + Object.keys(titulos).length;
  if (chave === listaDesenhada) return;
  listaDesenhada = chave; d.innerHTML = '';
  var t = document.createElement('div'); t.className = 'muted'; t.textContent = T('Playlist (toque para tocar)', 'Playlist (tap to play)'); d.appendChild(t);
  ids.forEach(function (id, i) {
    var b = document.createElement('button'); b.className = 'sec' + (i === m.indice ? ' atual' : '');
    b.textContent = (i === m.indice ? '▶️ ' : (i + 1) + '. ') + (titulos[id] || '…');
    b.onclick = function () { enviar({ t: 'cmd', acao: 'indice', i: i }); };
    d.appendChild(b);
  });
  buscarTitulos(ids);
}
function mostrarEstado(m) {
  cel.ultimoEstado = m;
  desenharLista(m);
  var p = $('placar'), ks = Object.keys(m.pontos || {}).sort(function (a, b) { return m.pontos[b].pontos - m.pontos[a].pontos; });
  p.innerHTML = ks.map(function (k) { return '<div><span>' + (k === cel.id ? '⭐ ' : '') + escapar(m.pontos[k].nome) + '</span><b>' + m.pontos[k].pontos + '</b></div>'; }).join('');
  if (m.tocando) status('🎵 ' + escapar(m.titulo || ''), 'ok');
  else if (cel.pc && cel.pc.connectionState === 'connected') status(T('Ao vivo na TV ✅ (sem música)', 'Live on the TV ✅ (no song)'), 'ok');
}
function status(txt, tipo) { var s = $('jogoStatus'); s.textContent = txt; s.className = 'status' + (tipo === 'ok' ? ' ok' : ''); if (tipo === 'erro') s.style.color = '#ff9a93'; else s.style.color = ''; }

function pedirWakeLock() {
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { cel.wake = w; }).catch(function () {}); } catch (e) {}
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    pedirWakeLock();
    // voltou do YouTube (ou de outro app): se a câmera morreu no fundo, religa e reconecta
    var tr = cel.stream && cel.stream.getVideoTracks()[0];
    if (!tr || tr.readyState === 'ended' || tr.muted) ligarCamera(cel.cams[cel.camIdx] && cel.cams[cel.camIdx].deviceId).then(function () { if (!cel.pc || cel.pc.connectionState !== 'connected') enviar({ t: 'join', id: cel.id, nome: cel.nome }); }).catch(function () {});
  });
}

/* --- Música --- */
function tocarLink(link) {
  link = link || $('link').value;
  var pl = idPlaylist(link);
  if (pl) {
    enviar({ t: 'cmd', acao: 'playlist', lista: pl }); $('link').value = ''; status(T('Mandei a playlist para a TV…', 'Sent the playlist to the TV…'), 'ok');
    fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/playlist?list=' + pl + '&format=json')
      .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
      .then(function (j) { guardarHist('list:' + pl, (j && j.title) || (T('Playlist', 'Playlist') + ' ' + pl.slice(0, 6) + '…')); });
    return;
  }
  var id = idYouTube(link);
  if (!id) { status(T('Não achei um link do YouTube aí.', 'That is not a YouTube link.'), 'erro'); return; }
  $('btTocarLink').disabled = true;
  fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=' + id + '&format=json')
    .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    .then(function (j) {
      var titulo = (j && j.title) || id;
      enviar({ t: 'cmd', acao: 'carregar', video: id, titulo: titulo });
      guardarHist(id, titulo);
      $('link').value = ''; $('btTocarLink').disabled = false;
      status(T('Mandei tocar: ', 'Sent to play: ') + titulo, 'ok');
    });
}
function guardarHist(id, titulo) {
  var h = lerHist().filter(function (x) { return x.id !== id; });
  h.unshift({ id: id, titulo: titulo });
  try { localStorage.setItem('danca:hist', JSON.stringify(h.slice(0, 30))); } catch (e) {}
  desenharHist();
}
function lerHist() { try { return JSON.parse(localStorage.getItem('danca:hist') || '[]'); } catch (e) { return []; } }
function desenharHist() {
  var h = lerHist(), d = $('hist'); d.innerHTML = '';
  if (!h.length) return;
  var t = document.createElement('div'); t.className = 'muted'; t.textContent = T('Suas músicas (segure para tirar)', 'Your songs (hold to remove)'); d.appendChild(t);
  h.forEach(function (x) {
    var b = document.createElement('button'); b.className = 'sec'; var pl = x.id.indexOf('list:') === 0; b.textContent = (pl ? '📜 ' : '🎵 ') + x.titulo;
    b.onclick = function () { tocarLink(pl ? 'https://www.youtube.com/playlist?list=' + x.id.slice(5) : x.id); };
    var seg; b.addEventListener('touchstart', function () { seg = setTimeout(function () { if (confirm(T('Tirar da lista?', 'Remove from the list?') + ' ' + x.titulo)) { try { localStorage.setItem('danca:hist', JSON.stringify(lerHist().filter(function (y) { return y.id !== x.id; }))); } catch (e) {} desenharHist(); } }, 700); }, { passive: true });
    b.addEventListener('touchend', function () { clearTimeout(seg); }); b.addEventListener('touchmove', function () { clearTimeout(seg); });
    d.appendChild(b);
  });
}

function sair() {
  enviar({ t: 'sair', id: cel.id });
  clearInterval(cel.timerEnergia);
  try { cel.pc && cel.pc.close(); } catch (e) {}
  if (cel.stream) cel.stream.getTracks().forEach(function (t) { t.stop(); });
  try { canal && sb.removeChannel(canal); } catch (e) {}
  canal = null; cel.pc = null; cel.tvViu = false;
  $('btEntrar').disabled = false;
  tela('entrar');
}

/* ---------- Botões ---------- */
$('btTV').onclick = iniciarTV;
$('btCel').onclick = function () { tela('entrar'); try { $('nome').value = localStorage.getItem('danca:nome') || ''; $('codigo').value = localStorage.getItem('danca:codigo') || ''; } catch (e) {} ($('nome').value ? $('codigo') : $('nome')).focus(); };
$('btEntrar').onclick = entrar;
$('codigo').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
$('btCamera').onclick = function () { if (cel.cams.length < 2) return; var i = (cel.camIdx + 1) % cel.cams.length; ligarCamera(cel.cams[i].deviceId).catch(function () {}); };
$('btSair').onclick = sair;
$('btTocarLink').onclick = function () { tocarLink(); };
$('link').addEventListener('keydown', function (e) { if (e.key === 'Enter') tocarLink(); });
$('btBuscar').onclick = function () { window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(T('just dance kids', 'just dance kids')), '_blank'); };
$('btPausa').onclick = function () { enviar({ t: 'cmd', acao: 'pausa' }); };
$('btReiniciar').onclick = function () { enviar({ t: 'cmd', acao: 'reiniciar' }); };
$('btProxima').onclick = function () { enviar({ t: 'cmd', acao: 'proxima' }); };
$('btAnterior').onclick = function () { enviar({ t: 'cmd', acao: 'anterior' }); };
var posicao = { pos: 'dir', grande: false };
function mandarPosicao() { enviar({ t: 'cmd', acao: 'posicao', pos: posicao.pos, grande: posicao.grande }); }
document.querySelectorAll('button.pos').forEach(function (b) { b.onclick = function () { document.querySelectorAll('button.pos').forEach(function (x) { x.classList.remove('ativo'); }); b.classList.add('ativo'); posicao.pos = b.getAttribute('data-pos'); mandarPosicao(); }; });
$('btGrande').onclick = function () { posicao.grande = !posicao.grande; $('btGrande').classList.toggle('ativo', posicao.grande); mandarPosicao(); };
document.querySelectorAll('button.fx').forEach(function (b) { b.onclick = function () { document.querySelectorAll('button.fx').forEach(function (x) { x.classList.remove('ativo'); }); b.classList.add('ativo'); enviar({ t: 'cmd', acao: 'efeitos', modo: b.getAttribute('data-fx') }); }; });
window.addEventListener('pagehide', function () { if (cel.pc) enviar({ t: 'sair', id: cel.id }); });
desenharHist();
try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js'); } catch (e) {}

/* Atalho: ?tv abre direto a tela de escolha com foco no botão da TV (para apertar OK no controle). */
/* Link que chegou pelo "Compartilhar" do YouTube (Web Share Target do manifesto): entra no campo e,
   se nome e código já são conhecidos, já entra na sala com ele. */
var compartilhado = (location.search.match(/[?&](?:link|text|url)=([^&]+)/) || []).map(decodeURIComponent)[1] || '';
if (compartilhado && (idYouTube(compartilhado) || idPlaylist(compartilhado))) {
  history.replaceState(null, '', location.pathname);
  $('btCel').click();
  $('link').value = compartilhado;
  if ($('nome').value && $('codigo').value) { entrar(); var esperaTV = setInterval(function () { if (cel.tvViu && $('jogo').classList.contains('ativa')) { clearInterval(esperaTV); tocarLink(compartilhado); } }, 500); setTimeout(function () { clearInterval(esperaTV); }, 20000); }
}
if (/[?&]tv=auto\b/.test(location.search)) iniciarTV();   // aberto pelo app da LG: já entra como TV
else if (/[?&]tv\b/.test(location.search)) $('btTV').focus();
})();
</script>
