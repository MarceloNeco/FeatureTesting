<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FeatureTesting — Laboratório de Features</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FeatureTesting">
<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --card-hover:#22262f;
  --text:#e8eaed; --muted:#9aa0a6; --border:#2a2f3a;
  --accent:#4285f4; --accent-soft:#1a2c4e;
  --ok:#34a853; --soon:#f9ab00; --danger:#ea4335;
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;margin:0}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:40px 16px 24px;text-align:center}
header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px}
header h1 span{color:var(--accent)}
header p{color:var(--muted);font-size:.95rem;margin-top:6px}
main{flex:1;max-width:860px;width:100%;margin:0 auto;padding:8px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
a.card{display:block;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:18px;text-decoration:none;color:var(--text);transition:all .18s}
a.card:hover{background:var(--card-hover);border-color:var(--accent);transform:translateY(-2px)}
.card .ico{font-size:1.8rem}
.card h2{font-size:1.02rem;margin:10px 0 4px}
.card p{color:var(--muted);font-size:.85rem;line-height:1.45}
.card .tag{display:inline-block;border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:600;margin-top:12px}
.tag.ativo{background:#12351e;color:#7ee2a0}
.tag.breve{background:#3d3113;color:#ffd66e}
/* celular: título fixo no topo enquanto a lista rola */
@media (max-width:700px){
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:16px 16px 12px;
    border-bottom:1px solid var(--border);padding-top:max(16px,env(safe-area-inset-top))}
  header p{font-size:.85rem}
  main{padding-top:16px}
}
/* instalar como app e tela cheia */
.acoes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.acoes button{min-height:44px;padding:8px 16px;border-radius:22px;border:1px solid var(--border);
  background:var(--accent-soft);color:var(--text);font-size:.9rem;font-weight:600;cursor:pointer}
.acoes button:hover{border-color:var(--accent)}
.passos{max-width:560px;margin:0 auto 16px;text-align:left;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;font-size:.9rem;line-height:1.5}
.passos ol{margin:8px 0 0;padding-left:20px}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px;border-top:1px solid var(--border)}
footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>

<header>
  <h1>🧪 Feature<span>Testing</span></h1>
  <p>Laboratório de experimentos — cada card é uma feature que roda direto no navegador</p>
  <div class="acoes">
    <button type="button" id="btInstalar">📲 Instalar como app</button>
    <button type="button" id="btTela" hidden>⛶ Tela cheia</button>
  </div>
</header>

<main>
  <div class="passos" id="passos" hidden aria-live="polite"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <a href="https://github.com/SEUUSUARIO/FeatureTesting" target="_blank">repositório no GitHub</a> · atualizado em 02/11/2026
</footer>

<script>
/* ====== ADICIONE NOVAS FEATURES AQUI ======
   Para incluir uma feature nova, acrescente um objeto:
   { ic:"🔧", nome:"Nome curto", desc:"O que ela faz (1 linha)",
     url:"arquivo.html", status:"ativo" }        ← "ativo" ou "breve"
   O card aparece sozinho na lista. */
const FEATURES = [
  {
    ic: "🌱",
    nome: "RootifyONE",
    desc: "Administração central da plataforma SolverONE.",
    url: "https://rootify-one.pages.dev/",
    status: "ativo"
  },
  {
    ic: "🧭",
    nome: "Hub de Projetos",
    desc: "Portal com os links para todos os apps.",
    url: "https://marceloneco.github.io/",
    status: "ativo"
  },
  {
    ic: "⚖️",
    nome: "Radar Judicial (LexSuiteONE)",
    desc: "Lê o Diário de Justiça Eletrônico Nacional e lista, todo dia, as ações novas contra empresas, com a ficha de cada uma. Roda no computador do escritório. / Daily list of new lawsuits against companies from Brazil's court gazette.",
    url: "https://judicial.solverone.com.br/",
    status: "ativo"
  },
  {
    ic: "🧾",
    nome: "Leitor de Comprovantes (OCR)",
    desc: "Fotografa a via do cliente da maquininha e extrai os campos (valor, data, CNPJ, NSU...) automaticamente.",
    url: "https://marceloneco.github.io/leitor-ocr/",
    status: "ativo"
  },
  {
    ic: "🎙️",
    nome: "Testar vozes premium",
    desc: "Ouve as vozes do Gemini e gera a amostra de voz do UM Contador de Histórias.",
    url: "https://solverone.com.br/contador-de-historias/GERAR-AMOSTRA-contador-de-historias.html",
    status: "ativo"
  },
  {
    ic: "🥗",
    nome: "HyperNutry",
    desc: "Nutrição fácil, ao alcance de todos: saciedade de verdade, sem passar fome.",
    url: "https://solverone.com.br/hypernutry/",
    status: "ativo"
  },
  {
    ic: "🤦",
    nome: "The Useless Man (Guia do Homem Inútil Offline)",
    desc: "Tudo o que homem precisa saber em casa e nunca sabe: 90 situações com humor e respostas que funcionam. Funciona sem internet. / The useless man's guide, offline.",
    url: "useless-man/",
    status: "ativo"
  },
  {
    ic: "🧳",
    nome: "GuiaXpert",
    desc: "Roteiros sob medida para a família, com várias opções, favoritos, lugares, mapa, clima e reservas guardadas com segurança. Funciona sem internet.",
    url: "https://solverone.com.br/guiaxpert/",
    status: "ativo"
  },
  {
    ic: "⏳",
    nome: "Teste: Fundo (segundo plano)",
    desc: "Módulo comum 1.9.0 — pílula de andamento, ✕, aviso ao fechar, resultado em outra tela e tela acesa. / Background work: progress pill, close warning, screen stays on.",
    url: "testes-modulo-comum.html#fundo",
    status: "ativo"
  },
  {
    ic: "⚡",
    nome: "Teste: Interruptores e Modo DEUS",
    desc: "Módulo comum 1.9.0 — desligar e religar funções, \"Quem obedece\" e manutenção. / Switches, GOD Mode and maintenance.",
    url: "testes-modulo-comum.html#interruptores",
    status: "ativo"
  },
  {
    ic: "🧩",
    nome: "Teste: Compatibilidade",
    desc: "Módulo comum 1.9.0 — navegador antigo, dados bloqueados, aberto dentro de outro app e versão mínima. / Browser compatibility.",
    url: "testes-modulo-comum.html#compat",
    status: "ativo"
  },
  {
    ic: "💬",
    nome: "Teste: Feedback dos usuários",
    desc: "Módulo comum 1.9.0 — 💬 em toda tela, print e vídeo, sem internet, pergunta do dia e Central de feedback. / User feedback.",
    url: "testes-modulo-comum.html#feedback",
    status: "ativo"
  },
  {
    ic: "☔",
    nome: "Bolinho de Chuva",
    desc: "Portal dos joguinhos da família: Bagunçolândia, Peluqueria, Vruuum!, Purpurina, Rabiscolândia, Dança na Sala e outros. / Family games portal.",
    url: "/kids/",
    status: "ativo"
  },
  {
    ic: "🗺️",
    nome: "ArchONE — mapa vivo (protótipo)",
    desc: "A plataforma SolverONE desenhada a partir dos manifestos arquitetura.json: serviços, apps, módulos, dados e integrações, com ficha e camadas de segurança e LGPD. Protótipo F0; o portal próprio nasce na F1. / Living map of the platform, generated from the manifests.",
    url: "arch-one/",
    status: "ativo"
  },
  {
    ic: "➕",
    nome: "Próxima feature",
    desc: "Espaço reservado — troque este card pela próxima ideia a ser testada.",
    url: "#",
    status: "breve"
  }
];

const grid = document.getElementById('grid');
FEATURES.forEach(f => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = f.url;
  if (f.status !== 'ativo') a.addEventListener('click', e => e.preventDefault());
  // computador (com mouse): abre em outra aba; no celular abre na mesma
  else if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    a.target = '_blank';
    a.rel = 'noopener';
  }
  a.innerHTML =
    '<div class="ico">' + f.ic + '</div>' +
    '<h2>' + f.nome + '</h2>' +
    '<p>' + f.desc + '</p>' +
    '<span class="tag ' + f.status + '">' + (f.status === 'ativo' ? '✅ testar' : '🚧 em breve') + '</span>';
  grid.appendChild(a);
});
</script>
<script>
/* Instalar como app (ícone na tela inicial do celular/tablet ou no computador) e tela cheia.
   Chrome, Edge e Samsung Internet oferecem o pedido de instalação (beforeinstallprompt); nos outros
   (iPhone/iPad, Safari do Mac, Firefox) o botão mostra o passo a passo do próprio navegador.
   Instalado, abre em tela cheia (manifest "fullscreen"); onde o sistema não deixa (computador),
   o primeiro toque liga a tela cheia. */
(function () {
  var EN = !/^pt/i.test(navigator.language || 'pt');
  var T = function (pt, en) { return EN ? en : pt; };
  var btI = document.getElementById('btInstalar'), btT = document.getElementById('btTela'), passos = document.getElementById('passos');
  var mm = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
  var instalado = mm('(display-mode: fullscreen)') || mm('(display-mode: standalone)') || navigator.standalone === true;
  var pedido = null;
  btI.textContent = '📲 ' + T('Instalar como app', 'Install as app');
  if (instalado) btI.hidden = true;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); pedido = e; });
  window.addEventListener('appinstalled', function () {
    btI.hidden = true; pedido = null;
    mostrar(T('✓ Instalado. Procure o ícone 🧪 FeatureTesting na tela inicial ou na lista de apps.', '✓ Installed. Look for the 🧪 FeatureTesting icon on your home screen or app list.'));
  });

  function mostrar(titulo, itens) {
    passos.textContent = '';
    var p = document.createElement('strong'); p.textContent = titulo; passos.appendChild(p);
    if (itens) {
      var ol = document.createElement('ol');
      itens.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });
      passos.appendChild(ol);
    }
    passos.hidden = false;
  }
  function passoAPasso() {
    var ua = navigator.userAgent;
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (ios) return mostrar(T('No iPhone ou iPad:', 'On iPhone or iPad:'), [
      T('Toque em Compartilhar (o quadrado com a seta ⬆️).', 'Tap Share (the square with the ⬆️ arrow).'),
      T('Role e toque em "Adicionar à Tela de Início".', 'Scroll and tap "Add to Home Screen".'),
      T('Toque em "Adicionar". O ícone 🧪 aparece na tela.', 'Tap "Add". The 🧪 icon shows up on the screen.')]);
    if (/Android/.test(ua)) {
      if (/SamsungBrowser/.test(ua)) return mostrar(T('No navegador da Samsung:', 'In Samsung Internet:'), [
        T('Toque no menu ≡ (embaixo, à direita).', 'Tap the ≡ menu (bottom right).'),
        T('Toque em "Adicionar página a" → "Tela inicial".', 'Tap "Add page to" → "Home screen".')]);
      return mostrar(T('No celular ou tablet Android:', 'On an Android phone or tablet:'), [
        T('Toque no menu ⋮ (em cima, à direita).', 'Tap the ⋮ menu (top right).'),
        T('Toque em "Instalar app" ou "Adicionar à tela inicial".', 'Tap "Install app" or "Add to home screen".')]);
    }
    if (/Firefox/.test(ua)) return mostrar(T('O Firefox do computador não instala sites como app.', 'Firefox on desktop cannot install sites as apps.'), [
      T('Abra este endereço no Google Chrome ou no Microsoft Edge.', 'Open this address in Google Chrome or Microsoft Edge.'),
      T('Toque em 📲 Instalar como app de novo.', 'Tap 📲 Install as app again.')]);
    if (/Macintosh/.test(ua) && /Safari/.test(ua) && !/Chrome|Chromium|Edg\//.test(ua)) return mostrar(T('No Safari do Mac:', 'In Safari on Mac:'), [
      T('Menu Arquivo → "Adicionar ao Dock".', 'File menu → "Add to Dock".')]);
    if (/Edg\//.test(ua)) return mostrar(T('No Microsoft Edge:', 'In Microsoft Edge:'), [
      T('Clique no menu … (em cima, à direita) → "Aplicativos".', 'Click the … menu (top right) → "Apps".'),
      T('Clique em "Instalar este site como um aplicativo".', 'Click "Install this site as an app".')]);
    return mostrar(T('No Google Chrome:', 'In Google Chrome:'), [
      T('Clique no ícone de instalar na ponta direita da barra de endereço (tela com seta ⬇️).', 'Click the install icon at the right end of the address bar (screen with a ⬇️ arrow).'),
      T('Ou: menu ⋮ → "Transmitir, salvar e compartilhar" → "Instalar página como app".', 'Or: ⋮ menu → "Cast, save and share" → "Install page as app".')]);
  }
  btI.addEventListener('click', function () {
    if (!pedido) return passoAPasso();
    pedido.prompt();
    pedido.userChoice.then(function (r) { if (r.outcome === 'accepted') btI.hidden = true; });
    pedido = null;
  });

  /* tela cheia (o iPhone não deixa: lá o app instalado já abre sem a barra do navegador) */
  var raiz = document.documentElement;
  var pedirTela = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
  var emTela = function () { return !!(document.fullscreenElement || document.webkitFullscreenElement); };
  if (!pedirTela || mm('(display-mode: fullscreen)')) return;
  function rotulo() { btT.textContent = emTela() ? '⛶ ' + T('Sair da tela cheia', 'Exit full screen') : '⛶ ' + T('Tela cheia', 'Full screen'); }
  function alternar() {
    if (emTela()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { var r = pedirTela.call(raiz); if (r && r.catch) r.catch(function () {}); }
  }
  rotulo(); btT.hidden = false;
  btT.addEventListener('click', alternar);
  document.addEventListener('fullscreenchange', rotulo);
  document.addEventListener('webkitfullscreenchange', rotulo);
  if (instalado) document.addEventListener('pointerdown', function primeiro(e) {
    document.removeEventListener('pointerdown', primeiro);
    if (!emTela() && e.target !== btT) alternar();
  });
})();
</script>
</body>
</html>
