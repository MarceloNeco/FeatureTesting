<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Roteiros de teste — módulo comum 1.9.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
<style>
:root{
  --bg:#0f1115; --card:#1a1d24; --card-hover:#22262f;
  --text:#e8eaed; --muted:#9aa0a6; --border:#2a2f3a;
  --accent:#4285f4; --accent-soft:#1a2c4e;
  --ok:#34a853; --soon:#f9ab00; --danger:#ea4335;
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;margin:0}
body{background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
header{padding:28px 16px 16px;text-align:center}
header h1{font-size:1.4rem;font-weight:700}
header h1 span{color:var(--accent)}
header p{color:var(--muted);font-size:.9rem;margin-top:6px}
.barra{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.barra a,.barra button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:20px;
  padding:7px 14px;font-size:.85rem;text-decoration:none;cursor:pointer}
.barra button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:8px 16px 40px}
section.tema{margin-top:28px;scroll-margin-top:12px}
section.tema>h2{font-size:1.15rem;margin-bottom:6px}
.nota{background:#3d3113;color:#ffd66e;border-radius:10px;padding:10px 12px;font-size:.88rem;margin:8px 0}
details.cartao{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-top:12px}
details.cartao[open]{border-color:var(--accent)}
details.cartao summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none}
details.cartao summary::-webkit-details-marker{display:none}
details.cartao summary::before{content:"▸ ";color:var(--accent)}
details.cartao[open] summary::before{content:"▾ "}
.corpo{padding:0 16px 16px;font-size:.92rem}
.corpo h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 4px}
.corpo ol{padding-left:22px}
.corpo li{margin:4px 0}
.apps{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.apps span{border-radius:20px;padding:2px 10px;font-size:.75rem;font-weight:600;background:#12351e;color:#7ee2a0}
.apps span.espera{background:#3d3113;color:#ffd66e}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px;border-top:1px solid var(--border)}
footer a{color:var(--accent);text-decoration:none}
</style>
</head>

  <h1>🧪 <span id="titulo"></span></h1>

const TXT = {
  titulo: { pt: "Roteiros de teste — módulo comum 1.9.0", en: "Test scripts — common module 1.9.0" },
  subtitulo: { pt: "Abra um cartão e siga os passos. Funciona no celular e no computador.", en: "Open a card and follow the steps. Works on phone and computer." },
  objetivo: { pt: "Objetivo", en: "Goal" }, onde: { pt: "Onde testar", en: "Where to test" },
  passos: { pt: "Passo a passo", en: "Steps" }, esperado: { pt: "Resultado esperado", en: "Expected result" },
  anotar: { pt: "Se der errado, anote", en: "If it goes wrong, note down" },
  vale: { pt: "Já dá para testar em", en: "Can be tested in" }, aguarda: { pt: "Aguardando", en: "Waiting for" },
  voltar: { pt: "← Voltar ao FeatureTesting", en: "← Back to FeatureTesting" }
};
let lang = 'pt';
try { lang = localStorage.getItem('ft:idioma') || ''; } catch (e) { lang = ''; }
if (lang !== 'pt' && lang !== 'en') lang = /^pt/i.test(navigator.language || 'pt') ? 'pt' : 'en';

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const t = o => esc(o[lang]);

function desenhar() {
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.title = TXT.titulo[lang];
  document.getElementById('titulo').textContent = TXT.titulo[lang];
  document.getElementById('subtitulo').textContent = TXT.subtitulo[lang];
  document.getElementById('voltar').textContent = TXT.voltar[lang];
  const barra = document.getElementById('barra');
  barra.innerHTML = TEMAS.map(g => '<a href="#' + g.id + '">' + g.ic + ' ' + t(g.nome) + '</a>').join('') +
    '<button type="button" data-l="pt" aria-pressed="' + (lang === 'pt') + '">PT</button>' +
    '<button type="button" data-l="en" aria-pressed="' + (lang === 'en') + '">EN</button>';
  barra.querySelectorAll('button').forEach(b => b.onclick = () => {
    lang = b.dataset.l;
    try { localStorage.setItem('ft:idioma', lang); } catch (e) {}
    desenhar();
  });
  document.getElementById('main').innerHTML = TEMAS.map(g =>
    '<section class="tema" id="' + g.id + '"><h2>' + g.ic + ' ' + t(g.nome) + '</h2>' +
    (g.nota ? '<p class="nota">⚠️ ' + t(g.nota) + '</p>' : '') +
    g.cartoes.map(c =>
      '<details class="cartao"><summary>' + t(c.titulo) + '</summary><div class="corpo">' +
      '<h3>' + t(TXT.vale) + '</h3><div class="apps">' +
        (c.apps.length ? c.apps.map(a => '<span>' + esc(APPS[a].nome + ' ' + APPS[a].versao) + '</span>').join('')
                       : '<span class="espera">' + t(TXT.aguarda) + ': ' + t(AGUARDANDO) + '</span>') + '</div>' +
      '<h3>' + t(TXT.objetivo) + '</h3><p>' + t(c.objetivo) + '</p>' +
      '<h3>' + t(TXT.onde) + '</h3><p>' + t(c.onde) + '</p>' +
      '<h3>' + t(TXT.passos) + '</h3><ol>' + c.passos[lang].map(p => '<li>' + esc(p) + '</li>').join('') + '</ol>' +
      '<h3>' + t(TXT.esperado) + '</h3><p>' + t(c.esperado) + '</p>' +
      '<h3>' + t(TXT.anotar) + '</h3><p>' + t(c.anotar) + '</p>' +
      '</div></details>'
    ).join('') + '</section>'
  ).join('');
  if (location.hash) { const alvo = document.getElementById(location.hash.slice(1)); if (alvo) alvo.scrollIntoView(); }
}
desenhar();
